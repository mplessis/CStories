name: Publish packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag matches cstoriesVersion
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep '^cstoriesVersion=' gradle.properties | cut -d'=' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match cstoriesVersion=$version"
            exit 1
          fi
      - name: Publish to GitHub Packages
        run: ./gradlew publishAllToGitHubPackages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
