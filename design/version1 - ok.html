<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CStories — Runtime Mockup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    /* Vela-inspired light fintech palette */
    --page-bg: #ECEEF2;
    --surface: #FFFFFF;
    --surface-muted: #F6F7F9;
    --surface-sunken: #F0F1F4;
    --border: #E7E9EE;
    --border-soft: #EFF1F4;
    --text: #14161A;
    --text-muted: #6B7280;
    --text-faint: #9AA1AC;
    --primary: #2F6FED;
    --primary-soft: #E8F0FE;
    --dark: #14161A;
    --success: #16A34A;
    --success-bg: #DCFCE7;
    --warning: #B45309;
    --warning-bg: #FEF3C7;
    --error: #DC2626;
    --error-bg: #FEE2E2;
    --radius-shell: 28px;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--font);
    color: var(--text);
    background: var(--page-bg);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- App shell ---------- */
  .app-shell {
    width: 100%;
    height: 100%;
    background: var(--surface);
    border-radius: 0;
    box-shadow: none;
    display: flex;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 248px;
    flex-shrink: 0;
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
  }

  .sidebar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.01em;
    color: var(--text);
    padding: 4px 10px 18px;
  }

  .sidebar .brand .logo {
    width: 28px;
    height: 28px;
    border-radius: 9px;
    background: var(--primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 13px;
    font-weight: 800;
  }

  .sidebar .search {
    margin-bottom: 18px;
    padding: 0 4px;
  }

  .sidebar .search input {
    width: 100%;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-muted);
    font-size: 13px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
  }

  .sidebar .search input::placeholder { color: var(--text-faint); }
  .sidebar .search input:focus { border-color: var(--primary); background: var(--surface); }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 0 4px;
  }

  .tree-group {
    user-select: none;
    margin-bottom: 4px;
  }

  /* Top-level group (e.g. "DesignSystem") acts as a section label, not a clickable folder */
  .sidebar-scroll > .tree-group > .tree-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 10px 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    cursor: pointer;
    border-radius: var(--radius-sm);
  }

  .sidebar-scroll > .tree-group > .tree-group-header:hover {
    color: var(--text-muted);
  }

  .sidebar-scroll > .tree-group > .tree-group-header .root-swatch {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .sidebar-scroll > .tree-group > .tree-group-header .root-swatch svg {
    width: 13px;
    height: 13px;
  }

  /* Nested sub-groups (e.g. "Buttons", "Cards") look like clickable folder rows */
  .tree-children .tree-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    font-size: 12.5px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: normal;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: var(--radius-sm);
  }

  .tree-children .tree-group-header:hover {
    background: var(--surface-muted);
    color: var(--text);
  }

  .tree-children .tree-group-header .group-swatch {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .tree-children .tree-group-header .group-swatch svg {
    width: 15px;
    height: 15px;
  }

  .chevron {
    display: inline-block;
    width: 10px;
    transition: transform 0.15s ease;
    font-size: 9px;
    color: var(--text-faint);
  }

  .tree-group.collapsed > .tree-group-header .chevron {
    transform: rotate(-90deg);
  }

  .tree-group.collapsed > .tree-children {
    display: none;
  }

  /* Indent guide: a vertical line materializes the group's nesting depth */
  .tree-children {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 6px;
    margin-left: 10px;
    padding-left: 10px;
    border-left: 1px solid var(--border-soft);
  }

  .tree-leaf {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: var(--radius-sm);
  }

  .tree-leaf .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }

  .tree-leaf:hover {
    background: var(--surface-muted);
    color: var(--text);
  }

  .tree-leaf.selected {
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 700;
  }

  .tree-leaf.selected .dot {
    background: var(--primary);
  }

  .sidebar-footer {
    margin-top: 14px;
    padding: 4px;
  }

  .promo-card {
    background: var(--dark);
    color: white;
    border-radius: var(--radius-md);
    padding: 16px;
  }

  .promo-card .promo-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .promo-card .promo-text {
    font-size: 11.5px;
    color: rgba(255,255,255,0.65);
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .promo-card button {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 9px 0;
    font-size: 12.5px;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
  }

  /* ---------- Main ---------- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--surface-muted);
  }

  .main-header {
    display: flex;
    align-items: center;
    padding: 22px 28px 16px;
    gap: 16px;
  }

  .main-header .titles h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .main-header .titles .subtitle {
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .main-header .titles .subtitle .sep { opacity: 0.5; }
  .main-header .titles .subtitle .current { color: var(--primary); font-weight: 700; }

  .main-header .spacer { flex: 1; }

  .main-header .search-input {
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 12.5px;
    font-family: var(--font);
    color: var(--text-muted);
    width: 200px;
    outline: none;
  }

  .main-header .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .main-header .icon-btn:hover {
    background: var(--surface-sunken);
  }

  .main-header .btn-dark {
    background: var(--dark);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 12.5px;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .main-body {
    flex: 1;
    display: flex;
    gap: 20px;
    padding: 4px 28px 28px;
    min-height: 0;
  }

  /* ---------- Canvas card ---------- */
  .canvas-card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    min-width: 0;
    box-shadow: 0 1px 2px rgba(20,22,26,0.03);
  }

  .canvas-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-soft);
  }

  .canvas-toolbar .label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .canvas-toolbar .label .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }

  .canvas-toolbar .actions {
    display: flex;
    gap: 8px;
  }

  .canvas-toolbar button {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    color: var(--text-muted);
  }

  .canvas-toolbar button:hover {
    background: var(--surface-muted);
    color: var(--text);
  }

  .story-frame {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 40px;
  }

  .story-stage {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 8px 24px rgba(20,22,26,0.06);
    padding: 56px;
    min-width: 280px;
    min-height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Controls panel ---------- */
  .controls-panel {
    width: 288px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 20px;
    overflow-y: auto;
    box-shadow: 0 1px 2px rgba(20,22,26,0.03);
  }

  .controls-panel h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    margin: 0;
    font-weight: 700;
  }

  .controls-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .controls-panel-header button {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 11.5px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    color: var(--text-muted);
  }

  .controls-panel-header button:hover {
    background: var(--surface-muted);
    color: var(--text);
  }

  .knob {
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-soft);
  }

  .knob:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .knob label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .knob input[type="text"],
  .knob select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: var(--font);
    background: var(--surface-muted);
    color: var(--text);
    outline: none;
  }

  .knob input[type="text"]:focus,
  .knob select:focus {
    border-color: var(--primary);
    background: var(--surface);
  }

  .knob-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .knob-toggle-row label { margin: 0; }

  .switch {
    position: relative;
    display: inline-block;
    width: 38px;
    height: 22px;
    flex-shrink: 0;
  }

  .switch input { opacity: 0; width: 0; height: 0; }

  .switch .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: var(--border);
    border-radius: 999px;
    transition: 0.2s;
  }

  .switch .slider:before {
    position: absolute;
    content: "";
    height: 16px;
    width: 16px;
    left: 3px;
    top: 3px;
    background-color: white;
    border-radius: 50%;
    transition: 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }

  .switch input:checked + .slider {
    background-color: var(--primary);
  }

  .switch input:checked + .slider:before {
    transform: translateX(16px);
  }

  .no-controls {
    font-size: 12px;
    color: var(--text-faint);
    font-style: italic;
  }

  /* ---------- Rendered example components ---------- */
  .demo-button {
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    font-family: var(--font);
  }

  .demo-button.filled {
    background: var(--primary);
    color: white;
  }

  .demo-button.outlined {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .demo-button.text {
    background: transparent;
    color: var(--primary);
  }

  .demo-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .demo-card {
    width: 260px;
    border-radius: var(--radius-md);
    padding: 22px;
    background: var(--surface);
  }

  .demo-card.elevated {
    box-shadow: 0 12px 30px rgba(20,22,26,0.10);
    border: 1px solid var(--border-soft);
  }

  .demo-card.outlined {
    border: 1px solid var(--border);
    box-shadow: none;
  }

  .demo-card h4 {
    margin: 0 0 8px 0;
    font-size: 16px;
    color: var(--text);
  }

  .demo-card p {
    margin: 0;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .demo-textfield {
    width: 240px;
  }

  .demo-textfield input {
    width: 100%;
    padding: 14px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-muted);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
  }

  .demo-textfield input.error {
    border-color: var(--error);
    background: var(--error-bg);
  }

  .demo-textfield .helper {
    font-size: 11px;
    margin-top: 6px;
    color: var(--text-faint);
  }

  .demo-textfield .helper.error {
    color: var(--error);
  }

  .demo-checkbox {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--text);
  }

  .demo-checkbox .box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 13px;
  }

  .demo-checkbox .box.checked {
    background: var(--primary);
    border-color: var(--primary);
  }

  .demo-badge {
    display: inline-flex;
    align-items: center;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }

  .demo-badge.success { background: var(--success-bg); color: var(--success); }
  .demo-badge.warning { background: var(--warning-bg); color: var(--warning); }
  .demo-badge.error { background: var(--error-bg); color: var(--error); }
</style>
</head>
<body>

  <div class="app-shell">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo">C</span>
        CStories
      </div>

      <div class="search">
        <input type="text" placeholder="Rechercher une story…" id="search-input" />
      </div>

      <div class="sidebar-scroll">
        <div class="tree-group" data-group>
          <div class="tree-group-header" data-toggle>
            <span class="chevron">▾</span> <span class="root-swatch"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="8" height="8" rx="2" fill="currentColor"/></svg></span> DesignSystem
          </div>
          <div class="tree-children">

            <div class="tree-group" data-group>
              <div class="tree-group-header" data-toggle>
                <span class="chevron">▾</span> <span class="group-swatch"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M12 3L21 8L12 13L3 8L12 3Z" fill="#2F6FED" fill-opacity="0.35" stroke="#2F6FED" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 12L12 17L21 12" stroke="#2F6FED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16L12 21L21 16" stroke="#2F6FED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/></svg></span> Buttons
              </div>
              <div class="tree-children">
                <span class="tree-leaf selected" data-story="button-primary"><span class="dot"></span>Primary</span>
                <span class="tree-leaf" data-story="button-secondary"><span class="dot"></span>Secondary</span>
                <span class="tree-leaf" data-story="button-disabled"><span class="dot"></span>Disabled</span>
              </div>
            </div>

            <div class="tree-group" data-group>
              <div class="tree-group-header" data-toggle>
                <span class="chevron">▾</span> <span class="group-swatch"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M12 3L21 8L12 13L3 8L12 3Z" fill="#8B5CF6" fill-opacity="0.35" stroke="#8B5CF6" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 12L12 17L21 12" stroke="#8B5CF6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16L12 21L21 16" stroke="#8B5CF6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/></svg></span> Cards
              </div>
              <div class="tree-children">
                <span class="tree-leaf" data-story="card-elevated"><span class="dot"></span>Elevated</span>
                <span class="tree-leaf" data-story="card-outlined"><span class="dot"></span>Outlined</span>
              </div>
            </div>

            <div class="tree-group" data-group>
              <div class="tree-group-header" data-toggle>
                <span class="chevron">▾</span> <span class="group-swatch"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M12 3L21 8L12 13L3 8L12 3Z" fill="#F59E0B" fill-opacity="0.35" stroke="#F59E0B" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 12L12 17L21 12" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16L12 21L21 16" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/></svg></span> Inputs
              </div>
              <div class="tree-children">
                <span class="tree-leaf" data-story="input-textfield"><span class="dot"></span>TextField</span>
                <span class="tree-leaf" data-story="input-checkbox"><span class="dot"></span>Checkbox</span>
              </div>
            </div>

            <div class="tree-group" data-group>
              <div class="tree-group-header" data-toggle>
                <span class="chevron">▾</span> <span class="group-swatch"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M12 3L21 8L12 13L3 8L12 3Z" fill="#10B981" fill-opacity="0.35" stroke="#10B981" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 12L12 17L21 12" stroke="#10B981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16L12 21L21 16" stroke="#10B981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/></svg></span> Badges
              </div>
              <div class="tree-children">
                <span class="tree-leaf" data-story="badge-default"><span class="dot"></span>Default</span>
                <span class="tree-leaf" data-story="badge-status"><span class="dot"></span>Status</span>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="promo-card">
          <div class="promo-title">Watch mode</div>
          <div class="promo-text">Rebuild automatiquement le catalogue à chaque changement de story.</div>
          <button type="button">./gradlew runCStories</button>
        </div>
      </div>
    </nav>

    <!-- Main -->
    <div class="main">
      <div class="main-header">
        <div class="titles">
          <h1>Story Preview</h1>
          <div class="subtitle" id="breadcrumb">
            DesignSystem <span class="sep">/</span> Buttons <span class="sep">/</span> <span class="current">Primary</span>
          </div>
        </div>
        <div class="spacer"></div>
        <button type="button" class="btn-dark">⬇ Export</button>
      </div>

      <div class="main-body">
        <div class="canvas-card">
          <div class="canvas-toolbar">
            <div class="label"><span class="live-dot"></span> Live preview</div>
          </div>
          <div class="story-frame">
            <div class="story-stage" id="story-stage">
              <!-- rendered example injected here -->
            </div>
          </div>
        </div>

        <div class="controls-panel">
          <div class="controls-panel-header">
            <h3>Controls</h3>
            <button type="button" title="Réinitialiser les knobs" id="reset-btn">↺ Reset</button>
          </div>
          <div id="knobs-container">
            <!-- knobs injected here -->
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // ---------- Story definitions ----------
  const stories = {
    "button-primary": {
      breadcrumb: ["DesignSystem", "Buttons", "Primary"],
      knobs: [
        { type: "text", key: "label", label: "label", value: "Confirmer" },
        { type: "boolean", key: "enabled", label: "enabled", value: true },
        { type: "select", key: "variant", label: "variant", value: "filled", options: ["filled", "outlined", "text"] },
      ],
      render: (state) =>
        `<button class="demo-button ${state.variant}" ${state.enabled ? "" : "disabled"}>${escapeHtml(state.label)}</button>`,
    },
    "button-secondary": {
      breadcrumb: ["DesignSystem", "Buttons", "Secondary"],
      knobs: [
        { type: "text", key: "label", label: "label", value: "Annuler" },
        { type: "boolean", key: "enabled", label: "enabled", value: true },
        { type: "select", key: "variant", label: "variant", value: "outlined", options: ["filled", "outlined", "text"] },
      ],
      render: (state) =>
        `<button class="demo-button ${state.variant}" ${state.enabled ? "" : "disabled"}>${escapeHtml(state.label)}</button>`,
    },
    "button-disabled": {
      breadcrumb: ["DesignSystem", "Buttons", "Disabled"],
      knobs: [
        { type: "text", key: "label", label: "label", value: "Indisponible" },
        { type: "boolean", key: "enabled", label: "enabled", value: false },
        { type: "select", key: "variant", label: "variant", value: "filled", options: ["filled", "outlined", "text"] },
      ],
      render: (state) =>
        `<button class="demo-button ${state.variant}" ${state.enabled ? "" : "disabled"}>${escapeHtml(state.label)}</button>`,
    },
    "card-elevated": {
      breadcrumb: ["DesignSystem", "Cards", "Elevated"],
      knobs: [
        { type: "text", key: "title", label: "title", value: "Titre de la carte" },
        { type: "text", key: "body", label: "body", value: "Un court texte descriptif pour illustrer le contenu de la carte." },
        { type: "boolean", key: "elevated", label: "elevated", value: true },
      ],
      render: (state) =>
        `<div class="demo-card ${state.elevated ? "elevated" : "outlined"}">
           <h4>${escapeHtml(state.title)}</h4>
           <p>${escapeHtml(state.body)}</p>
         </div>`,
    },
    "card-outlined": {
      breadcrumb: ["DesignSystem", "Cards", "Outlined"],
      knobs: [
        { type: "text", key: "title", label: "title", value: "Carte avec bordure" },
        { type: "text", key: "body", label: "body", value: "Variante sans ombre, avec un simple contour." },
        { type: "boolean", key: "elevated", label: "elevated", value: false },
      ],
      render: (state) =>
        `<div class="demo-card ${state.elevated ? "elevated" : "outlined"}">
           <h4>${escapeHtml(state.title)}</h4>
           <p>${escapeHtml(state.body)}</p>
         </div>`,
    },
    "input-textfield": {
      breadcrumb: ["DesignSystem", "Inputs", "TextField"],
      knobs: [
        { type: "text", key: "placeholder", label: "placeholder", value: "Adresse e-mail" },
        { type: "boolean", key: "error", label: "error", value: false },
      ],
      render: (state) =>
        `<div class="demo-textfield">
           <input type="text" class="${state.error ? "error" : ""}" placeholder="${escapeHtml(state.placeholder)}" />
           ${state.error ? `<div class="helper error">Champ invalide</div>` : `<div class="helper">Facultatif</div>`}
         </div>`,
    },
    "input-checkbox": {
      breadcrumb: ["DesignSystem", "Inputs", "Checkbox"],
      knobs: [
        { type: "text", key: "label", label: "label", value: "J'accepte les conditions" },
        { type: "boolean", key: "checked", label: "checked", value: true },
      ],
      render: (state) =>
        `<label class="demo-checkbox">
           <span class="box ${state.checked ? "checked" : ""}">${state.checked ? "✓" : ""}</span>
           ${escapeHtml(state.label)}
         </label>`,
    },
    "badge-default": {
      breadcrumb: ["DesignSystem", "Badges", "Default"],
      knobs: [
        { type: "text", key: "text", label: "text", value: "Nouveau" },
        { type: "select", key: "tone", label: "tone", value: "success", options: ["success", "warning", "error"] },
      ],
      render: (state) =>
        `<span class="demo-badge ${state.tone}">${escapeHtml(state.text)}</span>`,
    },
    "badge-status": {
      breadcrumb: ["DesignSystem", "Badges", "Status"],
      knobs: [
        { type: "text", key: "text", label: "text", value: "En attente" },
        { type: "select", key: "tone", label: "tone", value: "warning", options: ["success", "warning", "error"] },
      ],
      render: (state) =>
        `<span class="demo-badge ${state.tone}">${escapeHtml(state.text)}</span>`,
    },
  };

  const state = {}; // per-story current knob values
  let currentStory = "button-primary";

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function initStateFor(id) {
    if (state[id]) return state[id];
    const def = stories[id];
    const s = {};
    def.knobs.forEach((k) => { s[k.key] = k.value; });
    state[id] = s;
    return s;
  }

  function renderBreadcrumb(id) {
    const parts = stories[id].breadcrumb;
    const html = parts
      .map((p, i) =>
        i === parts.length - 1
          ? `<span class="current">${escapeHtml(p)}</span>`
          : `${escapeHtml(p)} <span class="sep">/</span>`
      )
      .join(" ");
    document.getElementById("breadcrumb").innerHTML = html;
  }

  function renderKnobs(id) {
    const def = stories[id];
    const s = state[id];
    const container = document.getElementById("knobs-container");
    if (def.knobs.length === 0) {
      container.innerHTML = `<div class="no-controls">Aucun control pour cette story</div>`;
      return;
    }
    container.innerHTML = def.knobs
      .map((k) => {
        if (k.type === "text") {
          return `
            <div class="knob">
              <label for="knob-${k.key}">${k.label}</label>
              <input type="text" id="knob-${k.key}" data-key="${k.key}" data-type="text" value="${escapeHtml(s[k.key])}" />
            </div>`;
        }
        if (k.type === "boolean") {
          return `
            <div class="knob">
              <div class="knob-toggle-row">
                <label for="knob-${k.key}">${k.label}</label>
                <label class="switch">
                  <input type="checkbox" id="knob-${k.key}" data-key="${k.key}" data-type="boolean" ${s[k.key] ? "checked" : ""} />
                  <span class="slider"></span>
                </label>
              </div>
            </div>`;
        }
        if (k.type === "select") {
          return `
            <div class="knob">
              <label for="knob-${k.key}">${k.label}</label>
              <select id="knob-${k.key}" data-key="${k.key}" data-type="select">
                ${k.options
                  .map((o) => `<option value="${o}" ${o === s[k.key] ? "selected" : ""}>${o}</option>`)
                  .join("")}
              </select>
            </div>`;
        }
        return "";
      })
      .join("");

    container.querySelectorAll("[data-key]").forEach((el) => {
      el.addEventListener("input", (e) => {
        const key = e.target.dataset.key;
        const type = e.target.dataset.type;
        const value = type === "boolean" ? e.target.checked : e.target.value;
        state[currentStory][key] = value;
        renderStage(currentStory);
      });
    });
  }

  function renderStage(id) {
    const def = stories[id];
    const s = state[id];
    document.getElementById("story-stage").innerHTML = def.render(s);
  }

  function selectStory(id) {
    currentStory = id;
    initStateFor(id);
    document.querySelectorAll(".tree-leaf").forEach((el) => {
      el.classList.toggle("selected", el.dataset.story === id);
    });
    renderBreadcrumb(id);
    renderKnobs(id);
    renderStage(id);
  }

  document.querySelectorAll(".tree-leaf").forEach((el) => {
    el.addEventListener("click", () => selectStory(el.dataset.story));
  });

  document.querySelectorAll("[data-toggle]").forEach((el) => {
    el.addEventListener("click", () => {
      el.closest(".tree-group").classList.toggle("collapsed");
    });
  });

  document.getElementById("reset-btn").addEventListener("click", () => {
    delete state[currentStory];
    selectStory(currentStory);
  });

  document.getElementById("search-input").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".tree-leaf").forEach((el) => {
      const match = !q || el.textContent.toLowerCase().includes(q);
      el.style.display = match ? "flex" : "none";
    });
  });

  // initial render
  selectStory(currentStory);
</script>

</body>
</html>
