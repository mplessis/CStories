[versions]
kotlin = "2.2.0"
compose-multiplatform = "1.8.2"
# Compose Hot Reload >= 1.2.0-alpha02 requires Compose Multiplatform >= 1.10.0;
# 1.1.1 is the latest stable release still compatible with 1.8.2.
compose-hot-reload = "1.1.1"
ksp = "2.2.0-2.0.2"
kotlinpoet = "2.2.0"

[libraries]
ksp-symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }
compose-hot-reload-runtime-api = { module = "org.jetbrains.compose.hot-reload:hot-reload-runtime-api", version.ref = "compose-hot-reload" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-hot-reload = { id = "org.jetbrains.compose.hot-reload", version.ref = "compose-hot-reload" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
